name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  NODE_VERSION: '22.x'

defaults:
  run:
    working-directory: modernex

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: modernex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build -w @modernex/web

      - name: Create production package
        run: |
          mkdir -p ../deploy/packages/api
          mkdir -p ../deploy/packages/web/dist
          mkdir -p ../deploy/node_modules/@modernex/shared

          # API — source + migrations + seed assets
          cp -r packages/api/src         ../deploy/packages/api/
          cp -r packages/api/migrations  ../deploy/packages/api/
          cp -r packages/api/seed-assets ../deploy/packages/api/
          cp    packages/api/package.json ../deploy/packages/api/

          # @modernex/shared: embed as real files in node_modules (not a workspace symlink).
          # Workspace symlinks stored in node_modules.tar.gz by Oryx resolve relative to the
          # build container's temp dir, not /home/site/wwwroot, causing ERR_MODULE_NOT_FOUND.
          cp -r packages/shared/src/. ../deploy/node_modules/@modernex/shared/src/
          cp    packages/shared/package.json ../deploy/node_modules/@modernex/shared/

          # Built frontend (served as static files by the API)
          cp -r packages/web/dist/. ../deploy/packages/web/dist/

          # Root package.json: flat deps from packages/api (no workspaces; @modernex/shared pre-bundled)
          python3 -c "
          import json
          with open('packages/api/package.json') as f:
              api = json.load(f)
          deps = {k: v for k, v in api['dependencies'].items() if k != '@modernex/shared'}
          root = {'name':'modernex-prod','version':'2.0.0','type':'module',
                  'scripts':{'start':'node packages/api/src/server.js'},
                  'engines':{'node':'>=22.0.0'},'dependencies':deps}
          print(json.dumps(root, indent=2))
          " > ../deploy/package.json

          # Lock file for npm packages — Oryx installs them natively on Azure (avoids
          # ABI issues with native modules like better-sqlite3)
          cd ../deploy && npm install --package-lock-only --ignore-scripts 2>&1 | tail -5

          # Zip: source + lock file + pre-bundled @modernex/shared; no other node_modules
          zip -ry ../deploy.zip . -x "*.git*" "*.DS_Store*" "*.pid" "*/node_modules/*" "node_modules/*"
          # Add @modernex/shared back as real files (already excluded above, re-add cleanly)
          zip -ry ../deploy.zip node_modules/@modernex/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Post-deploy health check
        run: |
          sleep 40
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"; then
              echo "✓ Deployment healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1

      - name: Upload deployment log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.sha }}
          path: modernex/packages/api/logs/
          retention-days: 7
