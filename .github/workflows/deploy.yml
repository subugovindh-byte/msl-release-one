# Builds a container image and points the App Service at it.
#
# WHY NOT ZIP DEPLOY: this workflow used to ship a zip WITHOUT node_modules and
# let Oryx install dependencies on the server. That made the native addons
# (better-sqlite3, bcrypt) compile against whichever Node ran npm — Oryx, Kudu
# (Node 18) or the runtime (Node 22) — and took prod down twice in 2026. The
# image now carries its own dependencies, so the runtime is fixed at build time.
#
# NOTE: GitHub only reads workflows from .github/workflows/ at the REPOSITORY
# ROOT. This is the file that actually runs; a copy under modernex/ would be
# silently ignored.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  ACR_NAME: modernexacr
  IMAGE_REPO: modernex/api
  # Matches the Dockerfile runtime, so CI tests on the same Node as production.
  NODE_VERSION: '22.x'

defaults:
  run:
    working-directory: modernex

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: azure-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: modernex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built by ACR on linux/amd64. The image runs `tsc && vite build` itself,
      # so the web bundle and the API ship as one artifact. No server-side build,
      # and prod is never stopped — the swap to the new image is the deploy.
      - name: Build and push image
        id: build
        run: |
          TAG="${GITHUB_SHA::12}-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:$TAG" \
            --image "$IMAGE_REPO:latest" \
            --file Dockerfile .

      # Pinned to the immutable tag, never :latest — so the running version is
      # always identifiable and rollback is just pointing at the previous tag.
      # APP_BUILD_TAG is what /api/health echoes back, which is how the last
      # step proves the new container is the one actually serving traffic.
      - name: Point App Service at the new image
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          az webapp config appsettings set \
            -g "$AZURE_RG" -n "$AZURE_WEBAPP_NAME" \
            --settings "APP_BUILD_TAG=$TAG" -o none
          az webapp config container set \
            -g "$AZURE_RG" -n "$AZURE_WEBAPP_NAME" \
            --container-image-name "$ACR_NAME.azurecr.io/$IMAGE_REPO:$TAG" -o none

      # Setting the image updates configuration only. App Service does not
      # reliably recycle the container on a tag change, so the previous build
      # can keep serving indefinitely while config claims otherwise. Restart
      # explicitly rather than hoping.
      - name: Restart so the new image is pulled
        run: az webapp restart -g "$AZURE_RG" -n "$AZURE_WEBAPP_NAME"

      # The gate that matters. A 200 from /api/health proves *something* is
      # healthy, and `linuxFxVersion` only proves what config says — both are
      # green when the old container is still serving. Asserting the build tag
      # reported BY the running process is the only check that distinguishes
      # "deployed" from "deploy silently did nothing".
      - name: Verify the running build is the one just built
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          for i in $(seq 1 40); do
            body=$(curl -s -m 20 "https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/health" || true)
            running=$(printf '%s' "$body" | jq -r '.build // empty' 2>/dev/null || true)
            echo "attempt $i: build=${running:-<none>} expected=$TAG"
            if [ "$running" = "$TAG" ]; then
              echo "deployed and serving: $TAG"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$AZURE_WEBAPP_NAME never reported build $TAG — the new image is not serving"
          exit 1
