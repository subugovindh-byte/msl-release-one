name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  NODE_VERSION: '22.x'

defaults:
  run:
    working-directory: modernex

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: modernex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build -w @modernex/web

      - name: Create production package
        run: |
          mkdir -p ../deploy/packages/api
          mkdir -p ../deploy/packages/web/dist

          # API — source + migrations + seed assets
          cp -r packages/api/src         ../deploy/packages/api/
          cp -r packages/api/migrations  ../deploy/packages/api/
          cp -r packages/api/seed-assets ../deploy/packages/api/
          cp    packages/api/package.json ../deploy/packages/api/

          # Build an npm-compatible tarball for @modernex/shared.
          # Background: Oryx extracts node_modules.tar.gz to /node_modules (filesystem root).
          # Workspace symlinks (/node_modules/@modernex/shared -> ../../packages/shared) then
          # resolve to /packages/shared (doesn't exist) causing ERR_MODULE_NOT_FOUND.
          # file:<tgz> deps are installed as real extracted files (no symlink), bypassing this.
          # We use tar directly instead of npm pack to avoid workspace-root interference.
          mkdir -p /tmp/shared-pack/package
          cp -r packages/shared/src /tmp/shared-pack/package/src
          cp    packages/shared/package.json /tmp/shared-pack/package/package.json
          tar czf ../deploy/shared-pkg.tgz -C /tmp/shared-pack package

          # Built frontend (served as static files by the API)
          cp -r packages/web/dist/. ../deploy/packages/web/dist/

          # Root package.json: API deps with @modernex/shared as a tgz file dep (no workspaces)
          python3 -c "
          import json
          with open('packages/api/package.json') as f:
              api = json.load(f)
          deps = dict(api['dependencies'])
          deps['@modernex/shared'] = 'file:./shared-pkg.tgz'
          root = {'name':'modernex-prod','version':'2.0.0','type':'module',
                  'scripts':{'start':'node packages/api/src/server.js'},
                  'engines':{'node':'>=22.0.0'},'dependencies':deps}
          print(json.dumps(root, indent=2))
          " > ../deploy/package.json

          # Lock file — Oryx builds natively on Azure (avoids ABI issues with better-sqlite3)
          cd ../deploy && npm install --package-lock-only --ignore-scripts 2>&1 | tail -5

          # Zip: source + shared-pkg.tgz + lock file; NO node_modules (Oryx installs natively)
          zip -ry ../deploy.zip . -x "*.git*" "*.DS_Store*" "*.pid" "*/node_modules/*" "node_modules/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Post-deploy health check
        run: |
          sleep 40
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"; then
              echo "✓ Deployment healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1

      - name: Upload deployment log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.sha }}
          path: modernex/packages/api/logs/
          retention-days: 7
