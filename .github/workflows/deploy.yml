# Builds a container image and points the App Service at it.
#
# WHY NOT ZIP DEPLOY: this workflow used to ship a zip WITHOUT node_modules and
# let Oryx install dependencies on the server. That made the native addons
# (better-sqlite3, bcrypt) compile against whichever Node ran npm — Oryx, Kudu
# (Node 18) or the runtime (Node 22) — and took prod down twice in 2026. The
# image now carries its own dependencies, so the runtime is fixed at build time.
#
# NOTE: GitHub only reads workflows from .github/workflows/ at the REPOSITORY
# ROOT. This is the file that actually runs; a copy under modernex/ would be
# silently ignored.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  ACR_NAME: modernexacr
  IMAGE_REPO: modernex/api
  # Matches the Dockerfile runtime, so CI tests on the same Node as production.
  NODE_VERSION: '22.x'

defaults:
  run:
    working-directory: modernex

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: azure-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: modernex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built by ACR on linux/amd64. The image runs `tsc && vite build` itself,
      # so the web bundle and the API ship as one artifact. No server-side build,
      # and prod is never stopped — the swap to the new image is the deploy.
      - name: Build and push image
        id: build
        run: |
          TAG="${GITHUB_SHA::12}-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:$TAG" \
            --image "$IMAGE_REPO:latest" \
            --file Dockerfile .

      # Pinned to the immutable tag, never :latest — so the running version is
      # always identifiable and rollback is just pointing at the previous tag.
      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            -g "$AZURE_RG" -n "$AZURE_WEBAPP_NAME" \
            --container-image-name "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ steps.build.outputs.tag }}"

      # A health check alone cannot tell "deployed and healthy" from "deploy did
      # nothing and the OLD version is healthy" — that false green is exactly how
      # the previous pipeline hid a broken deploy. Assert the image identity.
      - name: Verify the running image is the one just built
        run: |
          expected="DOCKER|$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ steps.build.outputs.tag }}"
          running=$(az webapp config show -g "$AZURE_RG" -n "$AZURE_WEBAPP_NAME" \
            --query linuxFxVersion -o tsv)
          echo "expected: $expected"
          echo "running:  $running"
          if [ "$running" != "$expected" ]; then
            echo "::error::App Service is not running the image this job built"
            exit 1
          fi

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
              "https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::health check never returned 200"
          exit 1
