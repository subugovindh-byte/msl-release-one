<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Modernex Stones LLP — v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── DARK THEME (default) ─── */
:root {
  --bg0:#141413; --bg1:#1e1a14; --bg2:#252018; --bg3:#2e2820;
  --rust:#d97757; --rustW:rgba(212,82,42,.14); --rustB:rgba(212,82,42,.32);
  --gold:#d97757; --goldW:rgba(200,153,62,.13); --goldB:rgba(200,153,62,.32);
  --sage:#788c5d; --sageW:rgba(122,171,126,.13); --sageB:rgba(122,171,126,.30);
  --blue:#6a9bcc; --blueW:rgba(91,155,213,.13);  --blueB:rgba(91,155,213,.30);
  --t1:#f4f0e8; --t2:rgba(180,172,162,.75); --t3:rgba(180,172,162,.42);
  --bd:rgba(180,172,162,.12); --bd2:rgba(212,82,42,.22);
}
/* ─── LIGHT THEME ─── */
[data-theme="light"] {
  --bg0:#faf9f5; --bg1:#ffffff; --bg2:#f4f2ec; --bg3:#ece8e0;
  --rust:#bf5c38; --rustW:rgba(184,58,24,.10); --rustB:rgba(184,58,24,.28);
  --gold:#bf5c38; --goldW:rgba(154,114,40,.10); --goldB:rgba(154,114,40,.28);
  --sage:#637548; --sageW:rgba(61,138,69,.10);  --sageB:rgba(61,138,69,.26);
  --blue:#4d7fad; --blueW:rgba(32,96,168,.10);  --blueB:rgba(32,96,168,.26);
  --t1:#1a1612; --t2:rgba(26,22,18,.58); --t3:rgba(26,22,18,.35);
  --bd:rgba(26,22,20,.12); --bd2:rgba(184,58,24,.20);
}
/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;font-size:13px}
body{height:100dvh;overflow:hidden;background:var(--bg0);color:var(--t1);
  font-family:'Lora',serif;display:flex;flex-direction:column;
  transition:background .28s,color .28s}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit;color:var(--t1)}
*{transition:background-color .22s,border-color .22s,color .18s}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
/* ─── LAYOUT ─── */
#root{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{height:50px;background:var(--bg1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;gap:8px}
.tb-brand{font-family:'Poppins',sans-serif;font-size:14px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--rust)}
.tb-sub{font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:1.5px;
  color:var(--t3);text-transform:uppercase;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:7px}
/* ─── THEME TOGGLE ─── */
.theme-btn{display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:20px;cursor:pointer;
  font-family:'Source Code Pro',monospace;font-size:9px;letter-spacing:.5px;
  border:1.5px solid var(--bd);background:var(--bg3);color:var(--t2)}
.theme-btn:hover{background:var(--rustW);border-color:var(--rustB);color:var(--t1)}
/* ─── BODY LAYOUT ─── */
.body-wrap{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:200px;flex-shrink:0;background:var(--bg1);
  border-right:1px solid var(--bd);display:flex;flex-direction:column;
  overflow-y:auto}
.sidebar::-webkit-scrollbar{display:none}
.page-area{flex:1;display:flex;flex-direction:column;overflow:hidden;
  min-width:0;position:relative}
/* ─── SIDEBAR ─── */
.sb-user{padding:9px 12px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:8px}
.sb-av{width:26px;height:26px;border-radius:50%;background:var(--rustW);
  border:1px solid var(--rustB);display:flex;align-items:center;
  justify-content:center;font-family:'Poppins',sans-serif;font-size:10px;
  font-weight:800;color:var(--rust);flex-shrink:0}
.sb-name{font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;color:var(--t1)}
.sb-role{font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--t3);margin-top:1px}
.sb-sec{padding:11px 12px 3px;font-family:'Source Code Pro',monospace;
  font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--t3)}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-left:2px solid transparent;cursor:pointer;color:var(--t2)}
.sb-item:hover{background:var(--rustW);color:var(--t1)}
.sb-item.active{border-left-color:var(--rust);background:var(--rustW);color:var(--t1)}
.sb-icon{font-family:'Source Code Pro',monospace;font-size:9px;color:var(--t3);flex-shrink:0}
.sb-item.active .sb-icon{color:var(--rust)}
.sb-label{font-family:'Source Code Pro',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.sb-badge{margin-left:auto;font-family:'Source Code Pro',monospace;font-size:8px;
  padding:1px 5px;border-radius:8px;min-width:15px;text-align:center}
.sb-badge-r{background:var(--rust);color:#fff}
.sb-badge-g{background:var(--gold);color:#fff}
.sb-foot{margin-top:auto;padding:11px 12px;border-top:1px solid var(--bd)}
.sb-foot-txt{font-family:'Source Code Pro',monospace;font-size:8px;color:var(--t3);line-height:1.9}
.sb-logout{font-family:'Source Code Pro',monospace;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;color:var(--t3);padding:4px 0;margin-top:6px;
  display:flex;align-items:center;gap:5px}
.sb-logout:hover{color:var(--rust)}
/* ─── CHIP ─── */
.chip{font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:.8px;
  padding:4px 8px;border-radius:3px;border:1px solid var(--bd);color:var(--t3)}
.chip-bkp{color:var(--sage);background:var(--sageW);border-color:var(--sageB);cursor:pointer}
.chip-bkp:hover{filter:brightness(1.1)}
/* ─── PAGE CONTENT ─── */
.pw{padding:16px 18px 28px;overflow-y:auto;flex:1}
.ph-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;
  color:var(--t1);letter-spacing:-.3px}
.ph-sub{font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--t3);margin-top:3px;margin-bottom:14px}
/* ─── STAT CARDS ─── */
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.sc{background:var(--bg2);border:1px solid var(--bd);border-radius:5px;
  padding:12px 11px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc.r::before{background:var(--rust)} .sc.g::before{background:var(--gold)}
.sc.s::before{background:var(--sage)} .sc.b::before{background:var(--blue)}
.sc-lbl{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.sc-val{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;
  color:var(--t1);line-height:1}
.sc-sub{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t3);margin-top:4px}
/* ─── CARD ─── */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:5px;margin-bottom:12px}
.card-head{padding:10px 13px;border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.card-title{font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--t1)}
.card-body{padding:13px}
/* ─── BUTTON ─── */
.btn{padding:8px 14px;border-radius:4px;font-family:'Poppins',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-p{background:var(--rust);color:#fff;border:none}
.btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-s{background:var(--bg3);color:var(--t2);border:1px solid var(--bd)}
.btn-s:hover:not(:disabled){color:var(--t1)}
.btn-g{background:transparent;color:var(--t2);border:1px solid var(--bd)}
.btn-g:hover:not(:disabled){color:var(--t1)}
.btn-sage{background:var(--sageW);color:var(--sage);border:1px solid var(--sageB)}
.btn-sm{padding:5px 10px;font-size:8px}
/* ─── FORM ─── */
.fg{margin-bottom:11px}
.fl{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--t3);display:block;margin-bottom:4px}
.fi,.fsel{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;
  padding:7px 9px;color:var(--t1);font-size:12px;outline:none}
.fi:focus,.fsel:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rustW)}
.fi::placeholder{color:var(--t3)}
.fsel{cursor:pointer;appearance:none}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* ─── TABLE ─── */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:5px}
.dt{width:100%;border-collapse:collapse;font-size:11px;min-width:480px}
.dt thead tr{background:var(--bg3);border-bottom:2px solid var(--bd2)}
.dt th{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);padding:8px 10px;text-align:left;white-space:nowrap}
.dt th.r{text-align:right}
.dt tbody tr{border-bottom:1px solid var(--bd)}
.dt tbody tr:hover{background:rgba(128,128,128,.05)}
.dt td{padding:8px 10px;color:var(--t2);vertical-align:middle}
.tdc{color:var(--t1)!important;font-weight:500}
.tdm{font-family:'Source Code Pro',monospace!important;font-size:10px!important}
.tda{font-family:'Source Code Pro',monospace;font-size:11px;color:var(--gold);text-align:right}
/* ─── BADGE ─── */
.bdg{font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:.5px;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid;display:inline-block;white-space:nowrap}
.b-r{color:var(--rust);border-color:var(--rustB);background:var(--rustW)}
.b-g{color:var(--gold);border-color:var(--goldB);background:var(--goldW)}
.b-s{color:var(--sage);border-color:var(--sageB);background:var(--sageW)}
.b-b{color:var(--blue);border-color:var(--blueB);background:var(--blueW)}
.b-d{color:var(--t2);border-color:var(--bd);background:rgba(128,128,128,.08)}
/* ─── TABS ─── */
.itabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.itabs::-webkit-scrollbar{display:none}
.itab{padding:8px 14px;font-family:'Source Code Pro',monospace;font-size:8.5px;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:var(--t3);
  border-bottom:2px solid transparent;flex-shrink:0}
.itab:hover{color:var(--t2)}
.itab.on{color:var(--rust);border-bottom-color:var(--rust);background:var(--rustW)}
/* ─── SEARCH BAR ─── */
.sbar{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.si{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--bd);
  border-radius:4px;padding:7px 9px;color:var(--t1);font-family:'Source Code Pro',monospace;
  font-size:10px;outline:none}
.si:focus{border-color:var(--rust)}
.si::placeholder{color:var(--t3)}
.sf{background:var(--bg3);border:1px solid var(--bd);border-radius:4px;
  padding:7px 8px;color:var(--t2);font-family:'Source Code Pro',monospace;
  font-size:9px;outline:none;cursor:pointer;max-width:120px}
/* ─── POS ─── */
.pos-wrap{display:flex;flex:1;overflow:hidden;min-height:0}
.pos-cat{flex:1;overflow-y:auto;padding:12px;min-width:0}
.slab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slab{background:var(--bg2);border:1px solid var(--bd);border-radius:5px;
  padding:10px 9px 8px;cursor:pointer;position:relative}
.slab:hover{border-color:var(--rustB);transform:translateY(-1px);background:var(--bg3)}
.slab.ink{border-color:var(--sageB);background:var(--sageW)}
.slab.low{border-color:var(--rustB)}
.sl-photo{width:100%;height:60px;object-fit:cover;border-radius:3px;margin:-2px 0 6px;background:var(--bg3);display:block}
.sl-photo-ph{width:100%;height:60px;border-radius:3px;margin:-2px 0 6px;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.inv-thumb{width:44px;height:32px;object-fit:cover;border-radius:3px;border:1px solid var(--bd);background:var(--bg3);display:block}
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:200}
.photo-box{background:var(--bg2);border:1px solid rgba(128,128,128,.15);border-radius:10px;width:100%;max-width:380px}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:4px;border:1px solid var(--bd);background:var(--bg3);display:block}
.photo-chip{position:absolute;top:5px;left:5px;padding:2px 6px;border-radius:3px;font-family:'Source Code Pro',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase}
.sl-var{font-family:'Poppins',sans-serif;font-size:10.5px;font-weight:700;
  color:var(--t1);line-height:1.3;margin-bottom:2px}
.sl-lot{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t3);margin-bottom:6px}
.sl-dims{font-family:'Source Code Pro',monospace;font-size:9px;color:var(--t2)}
.sl-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:7px}
.sl-price{font-family:'Source Code Pro',monospace;font-size:12px;font-weight:500;color:var(--gold)}
.sl-unit{font-size:7px;color:var(--t3);margin-left:1px}
.sl-sqft{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t3);margin-top:1px}
.sl-stk{font-family:'Source Code Pro',monospace;font-size:7.5px;margin-top:2px}
.sl-dot{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;
  background:var(--sage);display:flex;align-items:center;justify-content:center;
  font-family:'Source Code Pro',monospace;font-size:8px;font-weight:700;color:#141413}
/* ─── CART ─── */
.cart{width:270px;flex-shrink:0;background:var(--bg1);border-left:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden}
.cart-head{padding:9px 12px;border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cart-ht{font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--t1)}
.cart-cnt-bdg{font-family:'Source Code Pro',monospace;font-size:9px;
  background:var(--rustW);color:var(--rust);padding:1px 6px;border-radius:8px}
.cart-cust{padding:7px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.cart-cust-lbl{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.cart-list{flex:1;overflow-y:auto;min-height:0}
.cart-empty{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px}
.ce-ico{font-size:24px;opacity:.13}
.ce-txt{font-family:'Source Code Pro',monospace;font-size:8.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--t3)}
.ci{padding:8px 12px;border-bottom:1px solid rgba(128,128,128,.08)}
.ci-top{display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
.ci-nm{font-family:'Poppins',sans-serif;font-size:10px;font-weight:600;color:var(--t1);flex:1;line-height:1.3}
.ci-rm{color:var(--t3);font-size:12px;padding:2px;line-height:1}
.ci-rm:hover{color:var(--rust)}
.ci-dt{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t3);margin-top:2px;line-height:1.6}
.ci-bot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.qty{display:flex;align-items:center}
.qb{width:20px;height:20px;background:var(--bg3);border:1px solid var(--bd);
  color:var(--t1);display:flex;align-items:center;justify-content:center;font-size:12px}
.qb:first-child{border-radius:3px 0 0 3px} .qb:last-child{border-radius:0 3px 3px 0}
.qb:hover{background:var(--rust);border-color:var(--rust)}
.qn{width:24px;text-align:center;font-family:'Source Code Pro',monospace;font-size:11px;
  background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
  height:20px;line-height:20px;color:var(--t1)}
.ci-tot{font-family:'Source Code Pro',monospace;font-size:11px;color:var(--gold)}
.cart-tots{padding:9px 12px;background:var(--bg0);border-top:1px solid var(--bd);flex-shrink:0}
.tot-row{display:flex;justify-content:space-between;margin-bottom:3px}
.tot-lbl{font-family:'Source Code Pro',monospace;font-size:8px;color:var(--t3)}
.tot-val{font-family:'Source Code Pro',monospace;font-size:9px;color:var(--t1)}
.tot-div{border:none;border-top:1px solid var(--bd);margin:6px 0}
.tot-grand{display:flex;justify-content:space-between;align-items:baseline}
.tg-lbl{font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;color:var(--t1)}
.tg-val{font-family:'Source Code Pro',monospace;font-size:16px;color:var(--rust)}
.disc-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.disc-lbl{font-family:'Source Code Pro',monospace;font-size:8px;color:var(--t2);white-space:nowrap}
.disc-inp{flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:3px;
  padding:4px 7px;color:var(--t1);font-family:'Source Code Pro',monospace;font-size:10px;
  outline:none;text-align:right}
.disc-inp:focus{border-color:var(--rust)}
.cart-acts{padding:9px 12px;border-top:1px solid var(--bd);display:flex;gap:6px;flex-shrink:0}
/* ─── INVOICE OVERLAY ─── */
.inv-veil{position:absolute;inset:0;background:rgba(0,0,0,.78);
  display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow-y:auto}
.inv-box{background:var(--bg2);border:1px solid rgba(128,128,128,.15);border-radius:10px;
  width:100%;max-width:420px;max-height:95%;overflow-y:auto}
.inv-top{background:var(--bg3);padding:16px 16px 12px;border-bottom:1px solid var(--bd)}
.inv-co{font-family:'Poppins',sans-serif;font-size:16px;font-weight:800;color:var(--rust)}
.inv-meta{display:flex;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:6px}
.inv-ml{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:1px}
.inv-mv{font-family:'Source Code Pro',monospace;font-size:10px;color:var(--t1);font-weight:500}
.inv-body{padding:12px 16px}
.inv-sep{border-bottom:1px solid var(--bd);margin-bottom:10px;padding-bottom:9px}
.inv-sl{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.inv-cn{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:var(--t1)}
.inv-irn{background:var(--bg3);border-radius:4px;padding:7px 10px;margin-bottom:10px;border:1px solid var(--bd)}
.inv-irn-l{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--sage);margin-bottom:2px}
.inv-irn-v{font-family:'Source Code Pro',monospace;font-size:7.5px;color:var(--t2);
  word-break:break-all;line-height:1.5}
.inv-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:10px}
.inv-tbl th{font-family:'Source Code Pro',monospace;font-size:7.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--gold);padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.inv-tbl th:last-child,.inv-tbl td:last-child{text-align:right}
.inv-tbl td{padding:6px 4px;border-bottom:1px solid rgba(128,128,128,.08);

/* ════ REDUCER ════ */
function reducer(s,a){
  switch(a.type){
    case"CART_ADD":{
      const ex=s.cart.find(i=>i.slab.id===a.slab.id);
      if(ex){if(ex.qty>=a.slab.stock)return s;return{...s,cart:s.cart.map(i=>i.slab.id===a.slab.id?{...i,qty:i.qty+1}:i)};}
      /* Track the original master rate so we can show "MODIFIED" badge if user edits */
      return{...s,cart:[...s.cart,{slab:{...a.slab,_originalRate:a.slab.rate},qty:1}]};
    }
    case"CART_QTY":{const nq=(s.cart.find(i=>i.slab.id===a.id)?.qty||0)+a.d;if(nq<1)return{...s,cart:s.cart.filter(i=>i.slab.id!==a.id)};return{...s,cart:s.cart.map(i=>i.slab.id===a.id?{...i,qty:Math.min(nq,i.slab.stock)}:i)};}
    case"CART_RATE":{
      /* Override line rate without touching master price. Stored only on cart copy. */
      return{...s,cart:s.cart.map(i=>i.slab.id===a.id?{...i,slab:{...i.slab,rate:Math.max(0,Number(a.rate)||0)}}:i)};
    }
    case"CART_RM":return{...s,cart:s.cart.filter(i=>i.slab.id!==a.id)};
    case"CART_CLR":return{...s,cart:[]};
    case"SALE":{
      /* Decrement stock across both products (new v5 model) and slabs (legacy array kept in sync) */
      const prods=(s.products||[]).map(p=>{const ci=a.items.find(i=>i.slab.id===p.id);return ci?{...p,stock:Math.max(0,p.stock-ci.qty)}:p;});
      const sl=s.slabs.map(sl=>{const ci=a.items.find(i=>i.slab.id===sl.id);return ci?{...sl,stock:Math.max(0,sl.stock-ci.qty)}:sl;});
      return{...s,cart:[],slabs:sl,products:prods,invoices:[a.inv,...s.invoices]};
    }
    case"ADD_PO":return{...s,pos:[a.v,...s.pos]};
    case"ADD_JOB":return{...s,jobs:[a.v,...s.jobs]};
    case"ADD_CUST":return{...s,customers:[a.v,...s.customers]};
    case"ADD_VEND":return{...s,vendors:[a.v,...s.vendors]};
    case"MARK_PAID":return{...s,invoices:s.invoices.map(i=>i.id===a.id?{...i,paid:true}:i),payments:[{id:`RCT/${Date.now()}`,date:today(),type:"receipt",party:s.invoices.find(i=>i.id===a.id)?.customer||"",amount:s.invoices.find(i=>i.id===a.id)?.total||0,mode:"Manual",utr:"—"},...s.payments]};
    case"ADD_BKP":return{...s,backups:[a.v,...s.backups]};
    case"TOAST":return{...s,toasts:a.v};
    case"LOGIN":return{...s,user:a.v};
    case"LOGOUT":return{...s,user:null,cart:[]};
    case"THEME":return{...s,theme:a.v};
    default:return s;
  }
}

/* ════ TOAST (vanilla DOM — no React re-render needed) ════ */
let _toastTimer=null;
function toast(msg,err=false){
  const area=document.getElementById("toastArea");
  if(!area)return;
  area.innerHTML="";
  const d=document.createElement("div");
  d.className="toast"+(err?" err":"");
  d.textContent=msg;
  area.appendChild(d);
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{area.innerHTML="";},3200);
}

/* ════ PHOTO STORAGE — IndexedDB (no backend) ════
   Each slab's captured photo is stored locally keyed by slab ID.
   Variety defaults are inline SVG data-URLs shown when no custom photo exists. */
const DB_NAME="modernex-photos";
const STORE="slabPhotos";
let _dbPromise=null;
function openPhotoDB(){
  if(_dbPromise)return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{req.result.createObjectStore(STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
async function putPhoto(slabId,dataUrl){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(dataUrl,slabId);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getPhoto(slabId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const r=tx.objectStore(STORE).get(slabId);
    r.onsuccess=()=>resolve(r.result||null);
    r.onerror=()=>reject(r.error);
  });
}
async function delPhoto(slabId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(slabId);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getAllPhotos(){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const r=tx.objectStore(STORE).getAllKeys();
    const v=tx.objectStore(STORE).getAll();
    const result={};
    r.onsuccess=()=>{v.onsuccess=()=>{r.result.forEach((k,i)=>{result[k]=v.result[i];});resolve(result);};};
    r.onerror=()=>reject(r.error);
  });
}

/* Resize an image File to max 1600px JPEG, return data URL. */
async function resizeImageToDataURL(file,maxEdge=1600,quality=0.85){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const ratio=Math.min(1,maxEdge/Math.max(img.width,img.height));
    const w=Math.round(img.width*ratio);const h=Math.round(img.height*ratio);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    return c.toDataURL("image/jpeg",quality);
  }finally{URL.revokeObjectURL(url);}
}

/* React hook — subscribe to photo store, re-render on change. */
const {useEffect:useEffectR}=React;
function useSlabPhoto(slabId,variety){
  const[url,setUrl]=useState(null);
  useEffectR(()=>{
    let alive=true;
    getPhoto(slabId).then(p=>{if(alive)setUrl(p||VARIETY_PH[variety]||null);});
    const h=()=>{getPhoto(slabId).then(p=>{if(alive)setUrl(p||VARIETY_PH[variety]||null);});};
    window.addEventListener("modernex-photo-change",h);
    return()=>{alive=false;window.removeEventListener("modernex-photo-change",h);};
  },[slabId,variety]);
  return url;
}
const notifyPhotoChange=()=>window.dispatchEvent(new CustomEvent("modernex-photo-change"));

/* ════ QR GENERATION (browser-side via qrcodejs CDN) ════ */
/* Build NPCI UPI payment URI */
function buildUPIUri({upiId,payeeName,amount,invoiceId,note}){
  if(!upiId)return null;
  const p=new URLSearchParams();
  p.set("pa",upiId);
  if(payeeName)p.set("pn",payeeName);
  if(amount!=null)p.set("am",Number(amount).toFixed(2));
  if(invoiceId)p.set("tr",invoiceId);
  if(note)p.set("tn",String(note).slice(0,50));
  p.set("cu","INR");
  return "upi://pay?"+p.toString();
}

/* React component — renders any text/URL as a QR image.
   Uses qrcodejs which draws into a hidden div, then we pluck out the image. */
function QRImage({text,size=200,alt="QR"}){
  const divRef=React.useRef(null);
  const[imgSrc,setImgSrc]=useState(null);
  useEffect(()=>{
    if(!text||!window.QRCode)return;
    const host=document.createElement("div");
    try{
      new window.QRCode(host,{text:text,width:size,height:size,
        colorDark:"#000000",colorLight:"#ffffff",
        correctLevel:window.QRCode.CorrectLevel.M});
      /* qrcodejs renders either canvas or img inside `host` */
      setTimeout(()=>{
        const canvas=host.querySelector("canvas");
        const img=host.querySelector("img");
        if(canvas){setImgSrc(canvas.toDataURL("image/png"));}
        else if(img){setImgSrc(img.src);}
      },10);
    }catch(err){console.warn("QR render failed",err);}
  },[text,size]);
  if(!imgSrc)return e("div",{style:{width:size,height:size,background:"#fff",border:"1px solid #ddd",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"monospace",fontSize:9,color:"#999"}},"QR…");
  return e("img",{src:imgSrc,alt:alt,style:{width:size,height:size,display:"block"}});
}

/* React component — thumbnail that pulls from photo store */
function SlabThumb({slabId,variety,cls}){
  const url=useSlabPhoto(slabId,variety);
  if(!url)return e("div",{className:cls+"-ph"});
  return e("img",{src:url,alt:variety,className:cls,onError:ev=>{ev.currentTarget.style.display="none";}});
}

/* Photo capture modal */
function PhotoCaptureModal({slab,onClose}){
  const[preview,setPreview]=useState(null);
  const[saving,setSaving]=useState(false);
  const inputRef=React.useRef(null);
  const existing=useSlabPhoto(slab.id,slab.variety);
  const hasCustom=existing&&existing!==VARIETY_PH[slab.variety];

  async function onPick(ev){
    const f=ev.target.files?.[0];
    if(!f)return;
    if(!f.type.startsWith("image/")){toast("Please pick an image",true);return;}
    try{
      const data=await resizeImageToDataURL(f,1600,0.85);
      setPreview(data);
    }catch(err){toast("Resize failed: "+err.message,true);}
    ev.target.value="";
  }
  async function save(){
    if(!preview)return;
    setSaving(true);
    try{
      await putPhoto(slab.id,preview);
      notifyPhotoChange();
      toast("Photo saved");

function Products(){
  const{state}=useApp();
  const[q,setQ]=useState("");
  const[kf,setKf]=useState("All");
  const[vf,setVf]=useState("All");
  const products=state.products||[];
  const availKinds=useMemo(()=>{const s=new Set(products.map(p=>p.kind));return KIND_ORDER.filter(k=>s.has(k));},[products]);
  const varList=useMemo(()=>{const s=new Set(products.map(p=>p.variety));return["All",...Array.from(s).sort()];},[products]);
  const filtered=useMemo(()=>products.filter(p=>{
    if(kf!=="All"&&p.kind!==kf)return false;
    if(vf!=="All"&&p.variety!==vf)return false;
    if(q){const qx=q.toLowerCase();if(!(p.variety.toLowerCase().includes(qx)||p.id.toLowerCase().includes(qx)||(p.lot||"").toLowerCase().includes(qx)))return false;}
    return true;

  const byKindStats=useMemo(()=>{
    const m={};
    for(const p of products){
      if(!m[p.kind])m[p.kind]={count:0,value:0};
      m[p.kind].count++;
      m[p.kind].value+=p.rate*p.stock;
    }
    return m;
  },[products]);

  const detail=p=>{
    switch(p.kind){
      case"block":return `${p.L}×${p.W}×${p.H}m · ${p.cft} CFT`;

          e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:9,color:"var(--t2)",marginTop:2}},fK(st.value))

    ),

      e("thead",null,e("tr",null,[["ID"],["Kind"],["Variety"],["Details"],["Grade"],["Stock"],["Rate",true],["Value",true],["HSN"]].map(([h,r])=>e(TH,{key:h,right:r},h)))),

  const[accs,setAccs]=useState(()=>loadCollAccs());
  const[modal,setModal]=useState(null);
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState(blankCA());
  function blankCA(){return{id:"",name:"",kind:"upi",upi_id:"",upi_name:"",account_number:"",ifsc:"",bank_name:"",branch:"",account_holder:"",account_type:"current",is_default:false,active:true};}
  const upd=k=>v=>setForm(f=>({...f,[k]:v}));
  const refresh=()=>{const l=loadCollAccs();setAccs(l);window.dispatchEvent(new CustomEvent("modernex-coll-change"));};

  const save=(ev)=>{
    ev.preventDefault();
    if(!form.name){toast("Name required",true);return;}
    if((form.kind==="upi"||form.kind==="both")&&!form.upi_id){toast("UPI ID required",true);return;}
    if((form.kind==="bank"||form.kind==="both")&&(!form.account_number||!form.ifsc)){toast("Account # + IFSC required",true);return;}
    let list=loadCollAccs();
    if(modal==="new"){
      const n=list.filter(a=>/^CA\d+$/.test(a.id)).map(a=>+a.id.slice(2)).reduce((a,b)=>Math.max(a,b),0);
      const newAcc={...form,id:"CA"+String(n+1).padStart(3,"0")};
      if(newAcc.is_default)list.forEach(a=>a.is_default=false);
      list.push(newAcc);
      toast(newAcc.name+" added");
    }else{
      if(form.is_default)list.forEach(a=>{if(a.id!==editing.id)a.is_default=false;});
      list=list.map(a=>a.id===editing.id?{...a,...form}:a);
      toast(editing.name+" updated");
    }
    saveCollAccs(list);refresh();
    setModal(null);setEditing(null);setForm(blankCA());
  };
  const setDefault=(id)=>{
    const list=loadCollAccs().map(a=>({...a,is_default:a.id===id}));
    saveCollAccs(list);refresh();toast("Default account updated");
  };
  const deactivate=(acc)=>{
    if(!confirm(`Deactivate "${acc.name}"?`))return;
    const list=loadCollAccs().filter(a=>a.active).length;
    if(list<=1){toast("Cannot deactivate last active account",true);return;}
    const upd=loadCollAccs().map(a=>a.id===acc.id?{...a,active:false,is_default:false}:a);
    if(!upd.some(a=>a.is_default&&a.active))upd.find(a=>a.active).is_default=true;
    saveCollAccs(upd);refresh();toast(acc.name+" deactivated");
  };
  const reactivate=(acc)=>{
    const list=loadCollAccs().map(a=>a.id===acc.id?{...a,active:true}:a);
    saveCollAccs(list);refresh();toast(acc.name+" reactivated");
  };
  const openEdit=(acc)=>{setEditing(acc);setForm({...blankCA(),...acc});setModal("edit");};

  return e("div",{className:"pw"},
    e("div",{style:{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"flex-start"}},
      e("div",null,e("div",{className:"ph-title"},"Bank / UPI Accounts"),e("div",{className:"ph-sub"},"Where funds are received · "+accs.filter(a=>a.active).length+" active")),
      e("button",{className:"btn btn-p btn-sm",onClick:()=>{setForm(blankCA());setModal("new");}},"+ New Account")
    ),
    e("div",{className:"tw"},e("table",{className:"dt"},
      e("thead",null,e("tr",null,[["ID"],["Name"],["Kind"],["UPI / Bank"],["Status"],["Actions"]].map(([h])=>e(TH,{key:h},h)))),
      e("tbody",null,accs.map(a=>e(Row,{key:a.id},
        e(TD,{cls:"tdm"},a.id),
        e(TD,{cls:"tdc"},a.name,a.is_default&&e("span",{className:"bdg b-s",style:{marginLeft:6,fontSize:7}},"DEFAULT")),
        e(TD,null,e("span",{className:"bdg b-d"},{upi:"UPI",bank:"Bank",both:"UPI + Bank"}[a.kind])),
        e(TD,null,e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:9.5}},
          a.upi_id&&e("div",{style:{color:"var(--gold)"}},a.upi_id),
          a.account_number&&e("div",{style:{color:"var(--t2)",marginTop:2}},(a.bank_name||"")+" · ****"+a.account_number.slice(-4)+" · "+(a.ifsc||""))
        )),
        e(TD,null,e(SBdg,{v:a.active?"paid":"pending"})),
        e(TD,null,e("div",{style:{display:"flex",gap:4,flexWrap:"wrap"}},
          e("button",{className:"btn btn-s btn-sm",onClick:()=>openEdit(a)},"Edit"),
          a.active&&!a.is_default&&e("button",{className:"btn btn-sage btn-sm",onClick:()=>setDefault(a.id)},"Set Default"),
          a.active?e("button",{className:"btn btn-s btn-sm",onClick:()=>deactivate(a),style:{color:"var(--rust)"}},"Deactivate")
                  :e("button",{className:"btn btn-sage btn-sm",onClick:()=>reactivate(a)},"Reactivate")
        ))
      )))
    )),
    modal&&e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.78)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:14,overflowY:"auto"},onClick:ev=>ev.target===ev.currentTarget&&setModal(null)},
      e("div",{style:{background:"var(--bg2)",border:"1px solid rgba(128,128,128,.15)",borderRadius:10,width:"100%",maxWidth:440}},
        e("div",{style:{padding:"13px 16px",borderBottom:"1px solid var(--bd)",display:"flex",justifyContent:"space-between",alignItems:"center"}},
          e("span",{style:{fontFamily:"'Poppins',sans-serif",fontSize:13,fontWeight:700}},modal==="new"?"New Collection Account":"Edit "+editing?.name),
          e("button",{onClick:()=>setModal(null),style:{color:"var(--t3)",fontSize:15}},"✕")
        ),
        e("form",{onSubmit:save,style:{padding:"14px 16px"}},
          e("div",{className:"fg"},e("label",{className:"fl"},"Display Name *"),
            e("input",{className:"fi",required:true,maxLength:100,value:form.name,onChange:ev=>upd("name")(ev.target.value),placeholder:"e.g. HDFC Current — Main"})),
          e("div",{className:"fg"},e("label",{className:"fl"},"Kind *"),
            e("select",{className:"fi",value:form.kind,onChange:ev=>upd("kind")(ev.target.value),disabled:modal==="edit"},
              e("option",{value:"upi"},"UPI only"),e("option",{value:"bank"},"Bank only"),e("option",{value:"both"},"UPI + Bank"))),
          (form.kind==="upi"||form.kind==="both")&&e("div",null,
            e("div",{className:"fg"},e("label",{className:"fl"},"UPI ID *"),
              e("input",{className:"fi",value:form.upi_id,onChange:ev=>upd("upi_id")(ev.target.value),placeholder:"name@bank"})),
            e("div",{className:"fg"},e("label",{className:"fl"},"Payee Name"),
              e("input",{className:"fi",value:form.upi_name,onChange:ev=>upd("upi_name")(ev.target.value),placeholder:"Shown in UPI app"}))
          ),
          (form.kind==="bank"||form.kind==="both")&&e("div",null,
            e("div",{className:"fg"},e("label",{className:"fl"},"Account Number *"),
              e("input",{className:"fi",value:form.account_number,onChange:ev=>upd("account_number")(ev.target.value.replace(/\s/g,""))})),
            e("div",{className:"fg"},e("label",{className:"fl"},"IFSC *"),
              e("input",{className:"fi",maxLength:11,value:form.ifsc,onChange:ev=>upd("ifsc")(ev.target.value.toUpperCase()),placeholder:"HDFC0001234"})),
            e("div",{className:"fg"},e("label",{className:"fl"},"Bank Name"),
              e("input",{className:"fi",value:form.bank_name,onChange:ev=>upd("bank_name")(ev.target.value),placeholder:"HDFC Bank"})),
            e("div",{className:"fg"},e("label",{className:"fl"},"Branch"),
              e("input",{className:"fi",value:form.branch,onChange:ev=>upd("branch")(ev.target.value)})),
            e("div",{className:"fg"},e("label",{className:"fl"},"Account Holder"),
              e("input",{className:"fi",value:form.account_holder,onChange:ev=>upd("account_holder")(ev.target.value),placeholder:"Modernex Stones LLP"}))
          ),
          e("div",{style:{display:"flex",alignItems:"center",gap:7,margin:"10px 0"}},
            e("input",{type:"checkbox",id:"isDef",checked:form.is_default,onChange:ev=>upd("is_default")(ev.target.checked),style:{accentColor:"var(--rust)"}}),
            e("label",{htmlFor:"isDef",style:{fontFamily:"'Source Code Pro',monospace",fontSize:9,color:"var(--t2)"}},"Set as default collection account")
          ),
          e("div",{style:{display:"flex",gap:7,marginTop:10}},
            e("button",{className:"btn btn-p",type:"submit"},modal==="new"?"Create":"Save"),
            e("button",{className:"btn btn-s",type:"button",onClick:()=>setModal(null)},"Cancel")
          )
        )
      )
    )
  );
}

            e("div",{style:{flex:1}},e("div",{style:{display:"flex",gap:6,alignItems:"center",marginBottom:2}},e("span",{className:`bdg ${b.ok?"b-s":"b-r"}`},b.trigger),e("span",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:8,color:"var(--t3)"}},new Date(b.ts).toLocaleString("en-IN"))),e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:8.5,color:"var(--blue)",wordBreak:"break-all",lineHeight:1.5}},b.path)),
            e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:8,color:"var(--t3)",flexShrink:0}},b.sz+" MB")
          )),

            ["Tier 1 WAL: every committed write durable on-disk","Tier 2 Event: after invoice/payment/job close → max 1/15 min","Tier 3 Scheduled: node-cron at 02:00 IST daily","Restore: node scripts/restore-from-blob.js [date]"].map((l,i)=>e("div",{key:i},e("b",{style:{color:"var(--t1)"}},l.split(":")[0]+":"),l.split(":").slice(1).join(":")))
          )
        )

      [["JWT Auth Flow",[["Login","POST /auth/login · bcrypt r=12 · JWT 8h + refresh 30d"],["Guard","requireAuth(['role']) on every route · 403 if mismatch"],["Brute Force","5 attempts → 15 min lock · rate-limit 10/min on /auth"],["Key Vault","JWT_SECRET + BLOB_CONN via Azure Managed Identity"]]],
       ["Roles",ROLES.map(r=>[r.icon+" "+r.label,r.desc])]
      ].map(([title,rows])=>e("div",{key:title,className:"card",style:{marginBottom:0}},e("div",{className:"card-head"},e("span",{className:"card-title"},title)),e("div",{className:"card-body"},rows.map(([l,d])=>e("div",{key:l,style:{marginBottom:9,paddingBottom:9,borderBottom:"1px solid var(--bd)"}},e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:9,color:"var(--gold)",marginBottom:2}},l),e("div",{style:{fontFamily:"'Source Code Pro',monospace",fontSize:8.5,color:"var(--t2)",lineHeight:1.7}},d))))))
    ),

/* ════ NAV CONFIG ════ */
const NAV_ITEMS=[
  {sec:"Operations"},{id:"pos",lbl:"POS",icon:"[P]"},{id:"products",lbl:"Products",icon:"[N]"},{id:"inventory",lbl:"Inventory",icon:"[I]"},{id:"production",lbl:"Production",icon:"[G]"},
  {sec:"Finance"},{id:"purchase",lbl:"Purchase",icon:"[$]"},{id:"accounts",lbl:"Accounts",icon:"[A]"},{id:"reports",lbl:"Reports",icon:"[R]"},
  {sec:"Setup"},{id:"masters",lbl:"Masters",icon:"[M]"},{id:"collacc",lbl:"Bank/UPI",icon:"[B]"},{id:"system",lbl:"System",icon:"[S]"}
];
const PAGES={pos:POS,products:Products,inventory:Inventory,production:Production,purchase:Purchase,accounts:Accounts,reports:Reports,masters:Masters,collacc:CollectionAccounts,system:SystemPage};

/* ════ ROOT APP ════ */
function App(){
  const[state,dispatch]=useReducer(reducer,{
    user:null,theme:"dark",cart:[],toasts:[],
    slabs:SLABS,products:PRODUCTS,vendors:VENDORS,customers:CUSTOMERS,
    jobs:SEED_JOBS,invoices:SEED_INVS,pos:SEED_POS,payments:SEED_PMTS,backups:SEED_BKPS
  });
  const[page,setPage]=useState("pos");
  const[bkSyncing,setBkSyncing]=useState(false);

  /* ── THEME TOGGLE: only touches data-theme on <html> — CSS does the rest ── */
  const toggleTheme=useCallback(()=>{
    const t=state.theme==="dark"?"light":"dark";
    dispatch({type:"THEME",v:t});
    document.documentElement.setAttribute("data-theme",t);
  },[state.theme]);

  /* keep html attr in sync (e.g. on first render) */
  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",state.theme);
  },[state.theme]);

  const nav=useCallback(id=>setPage(id),[]);
  const cartCount=state.cart.reduce((s,i)=>s+i.qty,0);
  const unpaid=state.invoices.filter(i=>!i.paid).length;

  if(!state.user){
    return e(Ctx.Provider,{value:{state,dispatch}},e(Login));
  }

  const PageComp=PAGES[page]||Dashboard;

  return e(Ctx.Provider,{value:{state,dispatch}},
    e("div",{id:"root"},
      /* TOPBAR */
      e("div",{className:"topbar"},
        e("div",null,
          e("div",{className:"tb-brand"},CO),
          e("div",{className:"tb-sub"},"GST "+GSTIN+" · HSN "+HSN+" · FY 2025-26")
        ),
        e("div",{className:"tb-right"},
          e("span",{className:"chip"},today()),
          e("button",{onClick:()=>{setBkSyncing(true);setTimeout(()=>{dispatch({type:"ADD_BKP",v:{id:Date.now(),ts:new Date().toISOString(),trigger:"manual",path:`modernex/manual/${Date.now()}.db.gz`,sz:"2.5",ok:true}});setBkSyncing(false);toast("Backup → Azure Blob ✓");},1800);},className:"chip chip-bkp"},bkSyncing?"⟳ Syncing":"⬆ Backup"),
          /* ── THE THEME TOGGLE ── */
          e("button",{onClick:toggleTheme,className:"theme-btn","aria-label":"Toggle colour theme"},
            e("span",null,state.theme==="dark"?"☀":"🌙"),
            e("span",null,state.theme==="dark"?" Day":" Night")
          )
        )
      ),
      /* BODY */
      e("div",{className:"body-wrap"},
        /* SIDEBAR */
        e("div",{className:"sidebar"},
          e("div",{className:"sb-user"},
            e("div",{className:"sb-av"},state.user.name[0]),
            e("div",null,e("div",{className:"sb-name"},state.user.name),e("div",{className:"sb-role"},state.user.role))
          ),
          NAV_ITEMS.map((item,i)=>item.sec
            ?e("div",{key:i,className:"sb-sec"},item.sec)
            :e("div",{key:item.id,className:`sb-item${page===item.id?" active":""}`,onClick:()=>nav(item.id),title:item.lbl},
              e("span",{className:"sb-icon"},item.icon),
              e("span",{className:"sb-label"},item.lbl),
              item.id==="pos"&&cartCount>0&&e("span",{className:"sb-badge sb-badge-r"},cartCount),
              item.id==="accounts"&&unpaid>0&&e("span",{className:"sb-badge sb-badge-g"},unpaid)
            )
          ),
          e("div",{className:"sb-foot"},
            e("div",{className:"sb-foot-txt"},"SQLite WAL · Azure Blob\nJWT · bcrypt r=12\nGST 2024 · WCAG 2.2"),
            e("button",{className:"sb-logout",onClick:()=>{dispatch({type:"LOGOUT"});toast("Signed out");}},"⎋ Sign Out")
          )
        ),
        /* PAGE */
        e("div",{className:"page-area"},e(PageComp))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>
