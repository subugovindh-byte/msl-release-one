# Builds a container image and points the App Service at it.
#
# WHY NOT ZIP DEPLOY: this workflow used to ship a zip without node_modules and
# let App Service build dependencies on the server. That made the native addons
# (better-sqlite3, bcrypt) compile against whichever Node ran npm — Oryx, Kudu
# (Node 18) or the runtime (Node 22) — and took prod down twice in 2026. The
# image now carries its own dependencies, so the runtime is fixed at build time.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  ACR_NAME: modernexacr
  IMAGE_REPO: modernex/api
  # Matches the Dockerfile runtime, so CI tests on the same Node as production.
  NODE_VERSION: '22.x'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          # Start API + web in background
          npm run dev &
          sleep 15
          # Run e2e
          JWT_SECRET=test-$(openssl rand -hex 16) npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built by ACR on linux/amd64. The image runs `tsc && vite build` itself,
      # so the web bundle and the API ship as one reviewed artifact.
      - name: Build and push image
        id: build
        run: |
          TAG="${GITHUB_SHA::12}-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          az acr build \
            --registry "${{ env.ACR_NAME }}" \
            --image "${{ env.IMAGE_REPO }}:$TAG" \
            --image "${{ env.IMAGE_REPO }}:latest" \
            --file Dockerfile .

      # Pinned to the immutable tag, never :latest — so the running version is
      # always identifiable and `az webapp config container set` can roll back.
      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            -g "${{ env.AZURE_RG }}" \
            -n "${{ env.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:${{ steps.build.outputs.tag }}"

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "health check failed — investigate before retrying"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed for commit ${{ github.sha }}"
          # TODO: wire to SendGrid / Slack webhook
