name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: modernex-prod
  AZURE_RG: modernex-rg
  NODE_VERSION: '20.x'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          # Start API + web in background
          npm run dev &
          sleep 15
          # Run e2e
          JWT_SECRET=test-$(openssl rand -hex 16) npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build frontend
        run: npm run build -w @modernex/web

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy/packages/web
          # Backend
          cp -r packages/api deploy/packages/
          cp -r packages/shared deploy/packages/
          # Frontend build output
          cp -r packages/web/dist deploy/packages/web/
          # Root files
          cp package.json deploy/
          cp package-lock.json deploy/
          # Omit node_modules — App Service runs npm ci on deploy
          cd deploy && zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set persistent DB_PATH on staging slot
        run: |
          az webapp config appsettings set \
            -g ${{ env.AZURE_RG }} \
            -n ${{ env.AZURE_WEBAPP_NAME }} \
            --slot staging \
            --settings DB_PATH=/home/data/modernex.db NODE_ENV=production PORT=8080 WEBSITES_PORT=8080

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: deploy.zip

      - name: Smoke test staging
        run: |
          sleep 30  # give the slot time to restart
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/api/health"; then
              echo "✓ Staging healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "✗ Staging smoke test failed after 5 attempts"
          exit 1

      - name: Swap staging → production
        run: |
          az webapp deployment slot swap \
            -g ${{ env.AZURE_RG }} \
            -n ${{ env.AZURE_WEBAPP_NAME }} \
            --slot staging \
            --target-slot production

      - name: Post-deploy health check
        run: |
          sleep 20
          curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed for commit ${{ github.sha }}"
          # TODO: wire to SendGrid / Slack webhook
